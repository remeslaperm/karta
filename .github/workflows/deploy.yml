# Автоматическая сборка и публикация сайта на GitHub Pages.
# Запускается при каждой отправке изменений в ветку main
# (а также вручную: вкладка Actions → «Сборка и публикация сайта» → Run workflow).
#
# Однократная настройка репозитория:
# Settings → Pages → Build and deployment → Source: «GitHub Actions».

name: Сборка и публикация сайта

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Если изменения отправили несколько раз подряд — публикуется только последняя версия.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Получить код
        uses: actions/checkout@v4

      - name: Установить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Установить зависимости
        run: npm ci

      - name: Собрать сайт
        run: npm run build

      - name: Подготовить файлы для GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Опубликовать
        id: deployment
        uses: actions/deploy-pages@v4
